services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override .env so the app can reach the redis service by name.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./clips:/app/clips
    # Bind to localhost on the host; terminate TLS at a reverse proxy in front.
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  redis-data:
