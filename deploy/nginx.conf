server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    # Redirect all HTTP to HTTPS (certbot will update this automatically)
    # Comment this block out if you haven't set up SSL yet
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support (required for real-time score updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large clip file uploads
        client_max_body_size 500M;

        # Long timeout for clip processing
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
