<!DOCTYPE html>
<!--
  THE SOCIAL PREVIEW CARD (Open Graph / Twitter / Instagram / Discord / Reddit).

  WHY THIS FILE IS CHECKED IN. The previous card was a flat PNG with no source.
  By the time anyone looked at it, it was advertising "7 days free" and
  "$15/month" — a trial that had been removed and a price that had been retired
  — in the old gradient-text design. Nobody noticed for months, because the only
  place that copy existed was inside a binary. Every link shared to Instagram,
  Facebook, Twitter and Discord was selling an offer that did not exist.

  So the card is HTML, rendered against the SAME self-hosted fonts and the SAME
  palette tokens as the live landing page. Regenerate it with:

      node scripts/build_og_card.mjs

  v6 (2026-09-02): THE LOGO, AND ONLY THE LOGO. Owner: "make it so that
  preview just shows the logo". This is the cover of the landing page as a
  card — the big blurred mark as the light in the room, the sharp mark and
  the wordmark in the middle, the black around them. No copy, no numbers,
  no offer: the words a shared link carries are the og:title and
  og:description, which are text and cannot go stale inside a cached image.
  That also closes the whole class of failure this file was written about —
  a card with no claims on it has nothing to advertise wrongly.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Sora';font-style:normal;font-weight:100 900;src:url(/fonts/sora-var.woff2) format('woff2')}
  @font-face{font-family:'Plex';font-style:normal;font-weight:600;src:url(/fonts/plexmono-600.woff2) format('woff2')}

  /* The landing page's tokens. If these drift from api.py the card stops
     matching the page it links to. The violet pair is the logo's own colour. */
  :root{
    --void:#0E0B11; --bone:#0A0A0C;
    --glow:#B86ADC; --glow-ink:#C489E4; --flare:#D26AFB; --ember:#F7A745;
    --ink:#F2EAF7; --ink-2:#B9AEC4; --ink-3:#9C90A6;
    --hair:rgba(242,234,247,.085); --white:#FFFFFF;
    --mono:'Plex',ui-monospace,monospace; --sans:'Sora',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#000;color:var(--white);
    font-family:var(--sans);overflow:hidden;position:relative;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* The cover's mark: huge, blurred, behind everything — the brand's colour
     as the light in the room, exactly as on the homepage. Centred, so the
     light sits behind the lockup rather than beside it. */
  .mark{position:absolute;left:50%;top:50%;height:760px;width:auto;
    transform:translate(-50%,-52%);filter:blur(24px);opacity:.5;pointer-events:none;z-index:0}
  /* The cover's floor glow, so the bottom edge is not a hard cut. */
  .floor{position:absolute;left:0;right:0;bottom:0;height:220px;z-index:1;pointer-events:none;
    background:radial-gradient(110% 100% at 50% 100%,rgba(184,106,220,.16),transparent 64%)}

  /* The lockup: the cover's, at card size. */
  .lockup{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:28px}
  .lockup img{height:190px;width:auto;display:block}
  .word{font-family:var(--mono);font-weight:600;font-size:44px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink);line-height:1}

  .url{position:absolute;left:0;right:0;bottom:34px;z-index:3;text-align:center;font-family:var(--mono);
    font-weight:600;font-size:13px;letter-spacing:.22em;color:var(--ink-3);text-transform:lowercase}
</style>
</head>
<body>
<img class="mark" src="/logo-mark.png" alt="">
<div class="floor"></div>

<div class="lockup">
  <img src="/logo-mark.png" alt="">
  <div class="word">Highlightz</div>
</div>

<div class="url">highlightz.app</div>
</body>
</html>
